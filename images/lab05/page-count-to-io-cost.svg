<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">From page count to I/O cost</title>
  <desc id="svgDesc">Comparison of queries processing 100 and 100,000 SQL Server pages, followed by a conceptual illustration of logical page accesses, the buffer pool, and potential physical reads from storage.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#ffffff;stroke:#cbd5e1;stroke-width:2}.ink{fill:#172033}.muted{fill:#526174}.small{font:500 17px 'Segoe UI',Arial,sans-serif}.body{font:600 21px 'Segoe UI',Arial,sans-serif}.label{font:700 23px 'Segoe UI',Arial,sans-serif}.metric{font:700 34px 'Segoe UI',Arial,sans-serif}.tiny{font:500 15px 'Segoe UI',Arial,sans-serif}.arrow{stroke:#64748b;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.logical{fill:#e0f2fe;stroke:#0284c7;stroke-width:2}.memory{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.storage{fill:#fef3c7;stroke:#d97706;stroke-width:2}.pageA{fill:#7dd3fc;stroke:#0284c7;stroke-width:1}.pageB{fill:#60a5fa;stroke:#2563eb;stroke-width:1}.pageMuted{fill:#cbd5e1;stroke:#94a3b8;stroke-width:1}
    </style>
    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1440" height="900"/>

  <!-- Query page-count comparison -->
  <rect class="panel" x="56" y="44" width="642" height="300" rx="18"/>
  <rect class="panel" x="742" y="44" width="642" height="300" rx="18"/>

  <text class="label ink" x="88" y="91">Query A</text>
  <text class="metric" x="88" y="139" fill="#0369a1">100 pages</text>
  <text class="small muted" x="88" y="171">Page content involved</text>
  <text class="metric ink" x="88" y="218">≈ 800 KB</text>
  <g transform="translate(390 110)">
    <rect class="pageA" x="0" y="0" width="42" height="42" rx="5"/><rect class="pageA" x="52" y="0" width="42" height="42" rx="5"/><rect class="pageA" x="104" y="0" width="42" height="42" rx="5"/><rect class="pageA" x="156" y="0" width="42" height="42" rx="5"/>
    <rect class="pageA" x="0" y="54" width="42" height="42" rx="5"/><rect class="pageA" x="52" y="54" width="42" height="42" rx="5"/><rect class="pageA" x="104" y="54" width="42" height="42" rx="5"/><rect class="pageA" x="156" y="54" width="42" height="42" rx="5"/>
    <text class="tiny muted" x="99" y="127" text-anchor="middle">Representative pages</text>
  </g>
  <text class="small muted" x="88" y="292">100 × 8 KB of page content</text>

  <text class="label ink" x="774" y="91">Query B</text>
  <text class="metric" x="774" y="139" fill="#1d4ed8">100,000 pages</text>
  <text class="small muted" x="774" y="171">Page content involved</text>
  <text class="metric ink" x="774" y="218">≈ 781.25 MB</text>
  <g transform="translate(1080 108)">
    <g>
      <rect class="pageB" x="0" y="0" width="23" height="23" rx="3"/><rect class="pageB" x="29" y="0" width="23" height="23" rx="3"/><rect class="pageB" x="58" y="0" width="23" height="23" rx="3"/><rect class="pageB" x="87" y="0" width="23" height="23" rx="3"/><rect class="pageB" x="116" y="0" width="23" height="23" rx="3"/><rect class="pageB" x="145" y="0" width="23" height="23" rx="3"/><rect class="pageB" x="174" y="0" width="23" height="23" rx="3"/><rect class="pageB" x="203" y="0" width="23" height="23" rx="3"/>
      <rect class="pageB" x="0" y="31" width="23" height="23" rx="3"/><rect class="pageB" x="29" y="31" width="23" height="23" rx="3"/><rect class="pageB" x="58" y="31" width="23" height="23" rx="3"/><rect class="pageB" x="87" y="31" width="23" height="23" rx="3"/><rect class="pageB" x="116" y="31" width="23" height="23" rx="3"/><rect class="pageB" x="145" y="31" width="23" height="23" rx="3"/><rect class="pageB" x="174" y="31" width="23" height="23" rx="3"/><rect class="pageB" x="203" y="31" width="23" height="23" rx="3"/>
      <rect class="pageB" x="0" y="62" width="23" height="23" rx="3"/><rect class="pageB" x="29" y="62" width="23" height="23" rx="3"/><rect class="pageB" x="58" y="62" width="23" height="23" rx="3"/><rect class="pageB" x="87" y="62" width="23" height="23" rx="3"/><rect class="pageB" x="116" y="62" width="23" height="23" rx="3"/><rect class="pageB" x="145" y="62" width="23" height="23" rx="3"/><rect class="pageB" x="174" y="62" width="23" height="23" rx="3"/><rect class="pageB" x="203" y="62" width="23" height="23" rx="3"/>
      <text class="tiny muted" x="113" y="111" text-anchor="middle">Many more pages</text>
    </g>
  </g>
  <text class="small muted" x="774" y="292">100,000 × 8 KB of page content</text>

  <text class="small muted" x="720" y="386" text-anchor="middle">More pages generally mean more page-processing work</text>
  <path class="arrow" d="M720 402 V440" marker-end="url(#arrowHead)"/>

  <!-- Logical access stage -->
  <rect class="logical" x="420" y="462" width="600" height="104" rx="16"/>
  <text class="label" x="720" y="504" text-anchor="middle" fill="#075985">Logical page accesses</text>
  <text class="small" x="720" y="535" text-anchor="middle" fill="#075985">Pages accessed through the buffer pool</text>

  <path class="arrow" d="M720 566 V606" marker-end="url(#arrowHead)"/>

  <!-- Branch / cache outcomes -->
  <path class="arrow" d="M720 606 H390 V648" marker-end="url(#arrowHead)"/>
  <path class="arrow" d="M720 606 H1050 V648" marker-end="url(#arrowHead)"/>

  <rect class="memory" x="92" y="664" width="596" height="166" rx="16"/>
  <text class="label" x="390" y="707" text-anchor="middle" fill="#166534">Page already cached</text>
  <g transform="translate(180 730)">
    <rect x="0" y="0" width="58" height="58" rx="8" fill="#86efac" stroke="#16a34a" stroke-width="2"/>
    <path d="M14 17 H44 M14 29 H44 M14 41 H36" stroke="#166534" stroke-width="3" stroke-linecap="round"/>
    <path d="M78 29 H144" class="arrow" marker-end="url(#arrowHead)"/>
    <rect x="164" y="0" width="220" height="58" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
    <text class="body" x="274" y="25" text-anchor="middle" fill="#166534">Served from</text>
    <text class="body" x="274" y="48" text-anchor="middle" fill="#166534">memory</text>
  </g>
  <text class="small" x="390" y="817" text-anchor="middle" fill="#166534">No storage read is needed for that page</text>

  <rect class="storage" x="752" y="664" width="596" height="166" rx="16"/>
  <text class="label" x="1050" y="707" text-anchor="middle" fill="#92400e">Page not cached</text>
  <g transform="translate(838 730)">
    <rect x="0" y="0" width="58" height="58" rx="8" fill="#fcd34d" stroke="#d97706" stroke-width="2"/>
    <path d="M12 18 H46 M12 30 H46 M12 42 H46" stroke="#92400e" stroke-width="3" stroke-linecap="round"/>
    <path d="M78 29 H144" class="arrow" marker-end="url(#arrowHead)"/>
    <rect x="164" y="0" width="258" height="58" rx="10" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
    <text class="body" x="293" y="25" text-anchor="middle" fill="#92400e">Read from</text>
    <text class="body" x="293" y="48" text-anchor="middle" fill="#92400e">storage</text>
  </g>
  <text class="small" x="1050" y="817" text-anchor="middle" fill="#92400e">A physical read may be required</text>

  <!-- Footnote -->
  <text class="tiny muted" x="720" y="870" text-anchor="middle">Logical reads count page accesses, not unique pages. Read-ahead may fetch multiple pages in one storage I/O.</text>
</svg>
