<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">SQL Server data page structure</title>
  <desc id="svgDesc">A schematic 8 KB SQL Server data page showing the 96-byte page header, row data, free space, and the slot array at the end of the page. A companion diagram shows that each two-byte slot-array entry stores an offset to the start of a row.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow1" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,5 L0,10 Z" fill="#0f9f8f"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,5 L0,10 Z" fill="#6366f1"/>
    </marker>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,5 L0,10 Z" fill="#d97706"/>
    </marker>
    <style>
      .font { font-family: Inter, 'Segoe UI', Arial, sans-serif; }
      .section { font-size: 18px; font-weight: 700; letter-spacing: 1px; }
      .label { font-size: 21px; font-weight: 700; }
      .body { font-size: 18px; font-weight: 500; }
      .small { font-size: 15px; font-weight: 500; }
      .tiny { font-size: 13px; font-weight: 500; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- Main page: physical layout within one 8 KB page -->
  <rect x="55" y="62" width="865" height="776" rx="22" fill="#fbfdff" stroke="#94a3b8" stroke-width="2.5" filter="url(#shadow)"/>
  <text class="font section" x="92" y="112" fill="#334155">DATA PAGE</text>
  <rect x="790" y="82" width="88" height="40" rx="20" fill="#e2e8f0"/>
  <text class="font body" x="834" y="108" text-anchor="middle" fill="#334155">8 KB</text>

  <!-- Page header -->
  <rect x="92" y="145" width="791" height="91" rx="10" fill="#e0e7ff" stroke="#818cf8" stroke-width="2"/>
  <g class="font" text-anchor="middle">
    <text x="487" y="183" class="label" fill="#3730a3">Page header</text>
    <text x="487" y="211" class="body" fill="#4338ca">96 bytes</text>
  </g>

  <!-- Row data region -->
  <rect x="92" y="236" width="791" height="285" fill="#f0fdf4" stroke="#86c9a8" stroke-width="2"/>
  <text class="font section" x="120" y="267" fill="#166534">ROW DATA</text>

  <!-- Row 1 -->
  <rect x="126" y="286" width="720" height="56" rx="8" fill="#c7ead8" stroke="#43a77b" stroke-width="1.8"/>
  <text class="font body" x="151" y="321" fill="#14532d">Row 1</text>
  <path d="M270 298 V330 M485 298 V330 M690 298 V330" stroke="#78bd9b" stroke-width="1.5"/>
  <g fill="#317c5c" opacity="0.65">
    <rect x="292" y="305" width="145" height="18" rx="4"/>
    <rect x="507" y="305" width="145" height="18" rx="4"/>
    <rect x="712" y="305" width="110" height="18" rx="4"/>
  </g>

  <!-- Row 2 -->
  <rect x="126" y="365" width="720" height="56" rx="8" fill="#d8f0e3" stroke="#43a77b" stroke-width="1.8"/>
  <text class="font body" x="151" y="400" fill="#14532d">Row 2</text>
  <path d="M270 377 V409 M485 377 V409 M690 377 V409" stroke="#78bd9b" stroke-width="1.5"/>
  <g fill="#317c5c" opacity="0.55">
    <rect x="292" y="384" width="145" height="18" rx="4"/>
    <rect x="507" y="384" width="145" height="18" rx="4"/>
    <rect x="712" y="384" width="110" height="18" rx="4"/>
  </g>

  <!-- Row 3 -->
  <rect x="126" y="444" width="720" height="56" rx="8" fill="#c7ead8" stroke="#43a77b" stroke-width="1.8"/>
  <text class="font body" x="151" y="479" fill="#14532d">Row 3</text>
  <path d="M270 456 V488 M485 456 V488 M690 456 V488" stroke="#78bd9b" stroke-width="1.5"/>
  <g fill="#317c5c" opacity="0.65">
    <rect x="292" y="463" width="145" height="18" rx="4"/>
    <rect x="507" y="463" width="145" height="18" rx="4"/>
    <rect x="712" y="463" width="110" height="18" rx="4"/>
  </g>

  <!-- Free space -->
  <rect x="92" y="521" width="791" height="148" fill="#fffbeb" stroke="#e7bd63" stroke-width="2"/>
  <text class="font label" x="487" y="594" text-anchor="middle" fill="#92400e">Free space</text>
  <text class="font small" x="487" y="623" text-anchor="middle" fill="#a16207">Available space between row data and slot array</text>

  <!-- Slot array -->
  <rect x="92" y="669" width="791" height="137" rx="0 0 10 10" fill="#eff6ff" stroke="#7ba5e8" stroke-width="2"/>
  <text class="font section" x="120" y="700" fill="#1e40af">SLOT ARRAY</text>
  <g class="font" text-anchor="middle">
    <rect x="126" y="718" width="218" height="67" rx="8" fill="#dbeafe" stroke="#6395df" stroke-width="1.8"/>
    <text x="235" y="746" class="body" fill="#1e3a8a">Slot 0</text>
    <text x="235" y="770" class="small" fill="#1d4ed8">2 bytes</text>

    <rect x="378" y="718" width="218" height="67" rx="8" fill="#e0e7ff" stroke="#818cf8" stroke-width="1.8"/>
    <text x="487" y="746" class="body" fill="#3730a3">Slot 1</text>
    <text x="487" y="770" class="small" fill="#4338ca">2 bytes</text>

    <rect x="630" y="718" width="218" height="67" rx="8" fill="#ffedd5" stroke="#e7a34b" stroke-width="1.8"/>
    <text x="739" y="746" class="body" fill="#9a3412">Slot 2</text>
    <text x="739" y="770" class="small" fill="#c2410c">2 bytes</text>
  </g>

  <!-- Right-side explanation of slot-to-row mapping -->
  <rect x="970" y="62" width="575" height="776" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text class="font section" x="1010" y="112" fill="#334155">SLOT OFFSETS</text>
  <text class="font small" x="1010" y="145" fill="#64748b">Each slot entry identifies the start of a row.</text>

  <!-- Column headings -->
  <text class="font small" x="1078" y="207" text-anchor="middle" fill="#64748b">SLOT ARRAY</text>
  <text class="font small" x="1390" y="207" text-anchor="middle" fill="#64748b">ROW DATA</text>

  <!-- Mapping 0 -> row 1 -->
  <rect x="1015" y="235" width="128" height="66" rx="9" fill="#dbeafe" stroke="#6395df" stroke-width="1.8"/>
  <text class="font body" x="1079" y="263" text-anchor="middle" fill="#1e3a8a">Slot 0</text>
  <text class="font tiny" x="1079" y="284" text-anchor="middle" fill="#1d4ed8">2 bytes</text>
  <path d="M1150 268 H1300" fill="none" stroke="#0f9f8f" stroke-width="3" marker-end="url(#arrow1)"/>
  <text class="font tiny" x="1225" y="251" text-anchor="middle" fill="#0f766e">offset</text>
  <rect x="1315" y="235" width="190" height="66" rx="9" fill="#c7ead8" stroke="#43a77b" stroke-width="1.8"/>
  <text class="font body" x="1410" y="275" text-anchor="middle" fill="#14532d">Row 1</text>

  <!-- Mapping 1 -> row 2 -->
  <rect x="1015" y="355" width="128" height="66" rx="9" fill="#e0e7ff" stroke="#818cf8" stroke-width="1.8"/>
  <text class="font body" x="1079" y="383" text-anchor="middle" fill="#3730a3">Slot 1</text>
  <text class="font tiny" x="1079" y="404" text-anchor="middle" fill="#4338ca">2 bytes</text>
  <path d="M1150 388 H1300" fill="none" stroke="#6366f1" stroke-width="3" marker-end="url(#arrow2)"/>
  <text class="font tiny" x="1225" y="371" text-anchor="middle" fill="#4f46e5">offset</text>
  <rect x="1315" y="355" width="190" height="66" rx="9" fill="#d8f0e3" stroke="#43a77b" stroke-width="1.8"/>
  <text class="font body" x="1410" y="395" text-anchor="middle" fill="#14532d">Row 2</text>

  <!-- Mapping 2 -> row 3 -->
  <rect x="1015" y="475" width="128" height="66" rx="9" fill="#ffedd5" stroke="#e7a34b" stroke-width="1.8"/>
  <text class="font body" x="1079" y="503" text-anchor="middle" fill="#9a3412">Slot 2</text>
  <text class="font tiny" x="1079" y="524" text-anchor="middle" fill="#c2410c">2 bytes</text>
  <path d="M1150 508 H1300" fill="none" stroke="#d97706" stroke-width="3" marker-end="url(#arrow3)"/>
  <text class="font tiny" x="1225" y="491" text-anchor="middle" fill="#b45309">offset</text>
  <rect x="1315" y="475" width="190" height="66" rx="9" fill="#c7ead8" stroke="#43a77b" stroke-width="1.8"/>
  <text class="font body" x="1410" y="515" text-anchor="middle" fill="#14532d">Row 3</text>

  <!-- Key note -->
  <rect x="1015" y="605" width="490" height="174" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="font body" x="1045" y="648" fill="#334155">A slot stores a 2-byte offset</text>
  <text class="font body" x="1045" y="677" fill="#334155">to the beginning of its row.</text>
  <path d="M1045 702 H1475" stroke="#e2e8f0" stroke-width="1.5"/>
  <text class="font small" x="1045" y="735" fill="#64748b">The slot array grows from the end</text>
  <text class="font small" x="1045" y="758" fill="#64748b">of the page toward the row data.</text>

  <text class="font tiny" x="800" y="875" text-anchor="middle" fill="#94a3b8">Schematic layout — not to scale</text>
</svg>
