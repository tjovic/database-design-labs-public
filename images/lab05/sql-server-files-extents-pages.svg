<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="730" viewBox="0 0 1600 730" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">SQL Server data files, extents, and pages</title>
  <desc id="svgDesc">A SQL Server data file contains 8 KB pages. Pages are grouped into 64 KB extents, with eight pages in each extent. One extent is expanded to show its eight pages.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#172554" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .heading { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #172554; }
      .subtitle { font: 400 19px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .section { font: 700 19px 'Segoe UI', Arial, sans-serif; fill: #1e293b; letter-spacing: .5px; }
      .fileLabel { font: 700 23px 'Segoe UI', Arial, sans-serif; fill: #1e293b; }
      .fileSub { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #64748b; }
      .extentLabel { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .pageSmall { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .pageLabel { font: 700 17px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .pageSize { font: 500 14px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .calloutTitle { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .calloutText { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .foot { font: 400 15px 'Segoe UI', Arial, sans-serif; fill: #64748b; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1600" height="730" fill="#ffffff"/>

  <g transform="translate(0,-80)">
  <!-- Main data-file container -->
  <rect x="70" y="150" width="1460" height="275" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="105" y="193" class="fileLabel">Database data file</text>

  <!-- Extent 1 -->
  <g>
    <rect x="105" y="250" width="300" height="135" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2"/>
    <text x="255" y="275" class="extentLabel" text-anchor="middle">EXTENT 01  ·  64 KB</text>
    <g fill="#ffffff" stroke="#a5b4fc" stroke-width="1.5">
      <rect x="121" y="293" width="30" height="48" rx="4"/><rect x="155" y="293" width="30" height="48" rx="4"/>
      <rect x="189" y="293" width="30" height="48" rx="4"/><rect x="223" y="293" width="30" height="48" rx="4"/>
      <rect x="257" y="293" width="30" height="48" rx="4"/><rect x="291" y="293" width="30" height="48" rx="4"/>
      <rect x="325" y="293" width="30" height="48" rx="4"/><rect x="359" y="293" width="30" height="48" rx="4"/>
    </g>
    <g class="pageSmall" text-anchor="middle">
      <text x="136" y="322">1</text><text x="170" y="322">2</text><text x="204" y="322">3</text><text x="238" y="322">4</text>
      <text x="272" y="322">5</text><text x="306" y="322">6</text><text x="340" y="322">7</text><text x="374" y="322">8</text>
    </g>
    <text x="255" y="366" class="pageSmall" text-anchor="middle">8 pages × 8 KB</text>
  </g>

  <!-- Extent 2 selected -->
  <g>
    <rect x="435" y="250" width="300" height="135" rx="10" fill="#ccfbf1" stroke="#0f9f8f" stroke-width="3"/>
    <text x="585" y="275" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#115e59" text-anchor="middle">EXTENT 02  ·  64 KB</text>
    <g fill="#f0fdfa" stroke="#0f9f8f" stroke-width="1.5">
      <rect x="451" y="293" width="30" height="48" rx="4"/><rect x="485" y="293" width="30" height="48" rx="4"/>
      <rect x="519" y="293" width="30" height="48" rx="4"/><rect x="553" y="293" width="30" height="48" rx="4"/>
      <rect x="587" y="293" width="30" height="48" rx="4"/><rect x="621" y="293" width="30" height="48" rx="4"/>
      <rect x="655" y="293" width="30" height="48" rx="4"/><rect x="689" y="293" width="30" height="48" rx="4"/>
    </g>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#115e59" text-anchor="middle">
      <text x="466" y="322">1</text><text x="500" y="322">2</text><text x="534" y="322">3</text><text x="568" y="322">4</text>
      <text x="602" y="322">5</text><text x="636" y="322">6</text><text x="670" y="322">7</text><text x="704" y="322">8</text>
    </g>
  </g>

  <!-- Extent 3 -->
  <g>
    <rect x="765" y="250" width="300" height="135" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2"/>
    <text x="915" y="275" class="extentLabel" text-anchor="middle">EXTENT 03  ·  64 KB</text>
    <g fill="#ffffff" stroke="#a5b4fc" stroke-width="1.5">
      <rect x="781" y="293" width="30" height="48" rx="4"/><rect x="815" y="293" width="30" height="48" rx="4"/>
      <rect x="849" y="293" width="30" height="48" rx="4"/><rect x="883" y="293" width="30" height="48" rx="4"/>
      <rect x="917" y="293" width="30" height="48" rx="4"/><rect x="951" y="293" width="30" height="48" rx="4"/>
      <rect x="985" y="293" width="30" height="48" rx="4"/><rect x="1019" y="293" width="30" height="48" rx="4"/>
    </g>
    <g class="pageSmall" text-anchor="middle">
      <text x="796" y="322">1</text><text x="830" y="322">2</text><text x="864" y="322">3</text><text x="898" y="322">4</text>
      <text x="932" y="322">5</text><text x="966" y="322">6</text><text x="1000" y="322">7</text><text x="1034" y="322">8</text>
    </g>
    <text x="915" y="366" class="pageSmall" text-anchor="middle">8 pages × 8 KB</text>
  </g>

  <!-- More extents -->
  <g>
    <rect x="1095" y="250" width="395" height="135" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="1292" y="304" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#64748b" text-anchor="middle">… more extents</text>
  </g>

  <!-- Connector to expanded extent -->
  <path d="M585 389 L585 455 L800 455 L800 497" fill="none" stroke="#0f9f8f" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="645" y="437" width="310" height="34" rx="17" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="800" y="460" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f766e" text-anchor="middle">ONE EXTENT SHOWN IN DETAIL</text>

  <!-- Expanded extent panel -->
  <rect x="70" y="510" width="1460" height="245" rx="18" fill="#f0fdfa" stroke="#5eead4" stroke-width="2" filter="url(#shadow)"/>
  <text x="105" y="553" class="section">ONE EXTENT</text>
  <text x="1490" y="553" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f766e" text-anchor="end">64 KB total</text>

  <!-- Eight page tiles -->
  <g>
    <g fill="#ffffff" stroke="#0f9f8f" stroke-width="2">
      <rect x="105" y="585" width="160" height="105" rx="9"/>
      <rect x="279" y="585" width="160" height="105" rx="9"/>
      <rect x="453" y="585" width="160" height="105" rx="9"/>
      <rect x="627" y="585" width="160" height="105" rx="9"/>
      <rect x="801" y="585" width="160" height="105" rx="9"/>
      <rect x="975" y="585" width="160" height="105" rx="9"/>
      <rect x="1149" y="585" width="160" height="105" rx="9"/>
      <rect x="1323" y="585" width="160" height="105" rx="9"/>
    </g>
    <g text-anchor="middle">
      <g class="pageLabel">
        <text x="185" y="626">Page 1</text><text x="359" y="626">Page 2</text>
        <text x="533" y="626">Page 3</text><text x="707" y="626">Page 4</text>
        <text x="881" y="626">Page 5</text><text x="1055" y="626">Page 6</text>
        <text x="1229" y="626">Page 7</text><text x="1403" y="626">Page 8</text>
      </g>
      <g class="pageSize">
        <text x="185" y="657">8 KB</text><text x="359" y="657">8 KB</text>
        <text x="533" y="657">8 KB</text><text x="707" y="657">8 KB</text>
        <text x="881" y="657">8 KB</text><text x="1055" y="657">8 KB</text>
        <text x="1229" y="657">8 KB</text><text x="1403" y="657">8 KB</text>
      </g>
    </g>
  </g>
  <text x="800" y="724" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#0f766e" text-anchor="middle">8 pages × 8 KB = 64 KB</text>

  </g>
</svg>
