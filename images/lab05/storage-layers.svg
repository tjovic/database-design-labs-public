<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1266" viewBox="0 0 1100 1266" role="img" aria-labelledby="svgTitle svgDesc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="svgTitle">Storage layers from SQL Server rows to device sectors</title>
  <desc id="svgDesc">A data page with header, rows, and slot array is one of the eight pages of an extent. Extents are stored in the database data file, file space is allocated in NTFS clusters, and clusters consist of device sectors.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .font { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .group { font-size: 19px; font-weight: 700; letter-spacing: 1.5px; }
      .heading { font-size: 27px; font-weight: 700; fill: #172554; }
      .sub { font-size: 19px; fill: #475569; }
      .small { font-size: 16px; fill: #64748b; }
      .lab { font-size: 17px; fill: #475569; font-style: italic; }
      .lab { font-size: 17px; fill: #475569; font-style: italic; }
      .lab { font-size: 17px; fill: #475569; font-style: italic; }
      .lab { font-size: 17px; fill: #475569; font-style: italic; }
      .tiny { font-size: 14px; fill: #64748b; }
      .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .device-box { fill: #eef2ff; stroke: #8b9be8; stroke-width: 2; }
      .ntfs-box { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2; }
      .sql-box { fill: #ecfdf5; stroke: #34a38a; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1100" height="1266" fill="#ffffff"/>
  <rect x="38" y="30" width="1024" height="518" rx="24" fill="#f5fcf9" stroke="#a7f3d0" stroke-width="2"/>
  <rect x="66" y="50" width="250" height="42" rx="21" fill="#d1fae5"/>
  <text class="font group" x="191" y="78" text-anchor="middle" fill="#065f46">SQL SERVER</text>
  <rect x="98" y="372" width="904" height="158" rx="18" class="sql-box" filter="url(#shadow)"/>
  <path d="M300 322 L469 462 L559 462 L800 322 Z" fill="#d1fae5" opacity="0.55"/>
  <path d="M300 322 L469 462 M800 322 L559 462" stroke="#059669" stroke-width="2" stroke-dasharray="7 6" fill="none"/>
  <text class="font heading" x="128" y="412" fill="#065f46">EXTENT</text>
  <text class="font sub" x="128" y="440">8 pages = 1 extent (64 KB)</text>
  <g class="font" text-anchor="middle" font-size="16" fill="#065f46">
    <rect x="190" y="462" width="90" height="54" rx="7" fill="#bbf7d0" stroke="#10b981" stroke-width="1.5"/><text x="235" y="497">Page 1</text>
    <rect x="283" y="462" width="90" height="54" rx="7" fill="#bbf7d0" stroke="#10b981" stroke-width="1.5"/><text x="328" y="497">Page 2</text>
    <rect x="376" y="462" width="90" height="54" rx="7" fill="#bbf7d0" stroke="#10b981" stroke-width="1.5"/><text x="421" y="497">Page 3</text>
    <rect x="469" y="462" width="90" height="54" rx="7" fill="#6ee7b7" stroke="#059669" stroke-width="3"/><text x="514" y="497" font-weight="700">Page 4</text>
    <rect x="562" y="462" width="90" height="54" rx="7" fill="#bbf7d0" stroke="#10b981" stroke-width="1.5"/><text x="607" y="497">Page 5</text>
    <rect x="655" y="462" width="90" height="54" rx="7" fill="#bbf7d0" stroke="#10b981" stroke-width="1.5"/><text x="700" y="497">Page 6</text>
    <rect x="748" y="462" width="90" height="54" rx="7" fill="#bbf7d0" stroke="#10b981" stroke-width="1.5"/><text x="793" y="497">Page 7</text>
    <rect x="841" y="462" width="90" height="54" rx="7" fill="#bbf7d0" stroke="#10b981" stroke-width="1.5"/><text x="886" y="497">Page 8</text>
  </g>
  <rect x="300" y="104" width="500" height="218" rx="18" fill="#ffffff" stroke="#059669" stroke-width="3" filter="url(#shadow)"/>
  <text class="font heading" x="550" y="142" text-anchor="middle" fill="#065f46">DATA PAGE · 8 KB</text>
  <rect x="340" y="158" width="420" height="28" rx="5" fill="#d1fae5" stroke="#34a38a"/>
  <text class="font" x="550" y="178.0" text-anchor="middle" font-size="16" fill="#065f46">Page header</text>
  <rect x="340" y="192" width="420" height="26" rx="5" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text class="font" x="550" y="211.0" text-anchor="middle" font-size="16" fill="#065f46">Row</text>
  <rect x="340" y="224" width="420" height="26" rx="5" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text class="font" x="550" y="243.0" text-anchor="middle" font-size="16" fill="#065f46">Row</text>
  <rect x="340" y="256" width="420" height="26" rx="5" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text class="font" x="550" y="275.0" text-anchor="middle" font-size="16" fill="#065f46">Row</text>
  <rect x="340" y="288" width="420" height="26" rx="5" fill="#d1fae5" stroke="#34a38a"/>
  <text class="font" x="550" y="307.0" text-anchor="middle" font-size="16" fill="#065f46">Slot array</text>
  <path d="M38 569 H1062" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="10 9"/>
  <rect x="38" y="590" width="1024" height="656" rx="24" fill="#f8faff" stroke="#c7d2fe" stroke-width="2"/>
  <rect x="66" y="610" width="474" height="42" rx="21" fill="#e0e7ff"/>
  <text class="font group" x="303" y="637" text-anchor="middle" fill="#3730a3" style="font-size:17px;letter-spacing:1px">OPERATING SYSTEM AND STORAGE DEVICE</text>
  <path class="arrow" d="M550 530 V676"/>
  <text class="font lab" x="572" y="672">extents are stored in the file</text>
  <rect x="200" y="686" width="700" height="96" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="2.5" filter="url(#shadow)"/>
  <g transform="translate(244 701) scale(0.95)"><path d="M0 0 H54 L74 20 V66 H0 Z" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><path d="M54 0 V20 H74" fill="none" stroke="#475569" stroke-width="2"/><path d="M13 34 H60 M13 45 H60 M13 56 H48" stroke="#64748b" stroke-width="3" stroke-linecap="round"/></g>
  <text class="font heading" x="630" y="728" text-anchor="middle">DATABASE DATA FILE</text>
  <text class="font sub" x="630" y="758" text-anchor="middle">IndexLab.mdf  ·  optional .ndf files</text>
  <path class="arrow" d="M550 782 V832"/>
  <text class="font lab" x="572" y="818">file space is allocated in clusters</text>
  <rect x="98" y="842" width="904" height="160" rx="18" class="ntfs-box" filter="url(#shadow)"/>
  <text class="font heading" x="550" y="880" text-anchor="middle">NTFS FILE SYSTEM</text>
  <text class="font sub" x="550" y="908" text-anchor="middle">Clusters · e.g. 4 KB; 64 KB is often recommended for SQL Server data files</text>
  <g class="font" text-anchor="middle" font-size="17" fill="#334155">
    <rect x="166" y="926" width="192" height="56" rx="6" fill="#e2e8f0" stroke="#64748b"/><text x="262" y="960">cluster</text>
    <rect x="358" y="926" width="192" height="56" rx="6" fill="#e2e8f0" stroke="#64748b"/><text x="454" y="960">cluster</text>
    <rect x="550" y="926" width="192" height="56" rx="6" fill="#e2e8f0" stroke="#64748b"/><text x="646" y="960">cluster</text>
    <rect x="742" y="926" width="192" height="56" rx="6" fill="#e2e8f0" stroke="#64748b"/><text x="838" y="960">cluster</text>
  </g>
  <path class="arrow" d="M550 1002 V1052"/>
  <text class="font lab" x="572" y="1038">a cluster consists of sectors</text>
  <rect x="98" y="1062" width="904" height="160" rx="18" class="device-box" filter="url(#shadow)"/>
  <text class="font heading" x="550" y="1100" text-anchor="middle">STORAGE DEVICE</text>
  <text class="font sub" x="550" y="1128" text-anchor="middle">Sectors · typically 512 B or 4 KB</text>
  <g class="font" text-anchor="middle" font-size="17" fill="#312e81">
    <rect x="166" y="1146" width="96" height="56" rx="6" fill="#c7d2fe" stroke="#818cf8"/><text x="214" y="1180">sector</text>
    <rect x="262" y="1146" width="96" height="56" rx="6" fill="#c7d2fe" stroke="#818cf8"/><text x="310" y="1180">sector</text>
    <rect x="358" y="1146" width="96" height="56" rx="6" fill="#c7d2fe" stroke="#818cf8"/><text x="406" y="1180">sector</text>
    <rect x="454" y="1146" width="96" height="56" rx="6" fill="#c7d2fe" stroke="#818cf8"/><text x="502" y="1180">sector</text>
    <rect x="550" y="1146" width="96" height="56" rx="6" fill="#c7d2fe" stroke="#818cf8"/><text x="598" y="1180">sector</text>
    <rect x="646" y="1146" width="96" height="56" rx="6" fill="#c7d2fe" stroke="#818cf8"/><text x="694" y="1180">sector</text>
    <rect x="742" y="1146" width="96" height="56" rx="6" fill="#c7d2fe" stroke="#818cf8"/><text x="790" y="1180">sector</text>
    <rect x="838" y="1146" width="96" height="56" rx="6" fill="#c7d2fe" stroke="#818cf8"/><text x="886" y="1180">sector</text>
  </g>
</svg>
