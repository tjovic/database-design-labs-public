<title id="title">Clustered index — inserting 58, 60 and 75</title>
<desc id="desc">The clustered B+ tree after inserting MemberID values 58, 60 and 75. Three leaf page splits occur, and the first split also causes the intermediate page to split. The root gains separator key 61.</desc>
