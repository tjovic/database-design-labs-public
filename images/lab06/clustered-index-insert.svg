 .page{font-size:12px;font-weight:700;fill:#64748B}
 .key{font-size:17px;font-weight:700;text-anchor:middle;dominant-baseline:middle}
 .head{font-size:9px;font-weight:700;fill:#64748B}
 .val{font-size:11px;font-weight:600}
