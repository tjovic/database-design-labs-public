<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="715" viewBox="0 0 1600 715" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><style>
