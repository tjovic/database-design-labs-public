<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#1E293B}
.title{font-size:32px;font-weight:700}.sub{font-size:17px;fill:#64748B}
.page{font-size:16px;font-weight:700;fill:#526176}.head{font-size:12px;font-weight:700;fill:#64748B}
.cell{font-size:15px;font-weight:600}.note{font-size:16px;fill:#475569}
</style></defs>
<rect width="1600" height="900" fill="#fff"/>
<text class="title" x="64" y="62">Heap table storage</text>
<text class="sub" x="64" y="94">A heap is a table without a clustered index — rows are not maintained in index-key order.</text>
<rect x="64" y="145" width="1472" height="82" rx="12" fill="#F8FAFC" stroke="#D8E1EC" stroke-width="1.5"/>
<text x="92" y="178" font-size="13" font-weight="700" fill="#64748B">TABLE</text>
<text x="92" y="207" font-size="25" font-weight="700">dbo.Member</text>
<text x="410" y="178" font-size="13" font-weight="700" fill="#64748B">STORAGE ORGANIZATION</text>
<text x="410" y="207" font-size="19" font-weight="600">Heap — no clustered index, no key-based row order</text>
<rect x="1240" y="169" width="260" height="36" rx="18" fill="#FFF7ED" stroke="#FDBA74"/>
<text x="1370" y="192" text-anchor="middle" font-size="14" font-weight="700" fill="#C2410C">UNORDERED ROWS</text>
<text x="64" y="285" font-size="15" font-weight="700" letter-spacing="1" fill="#526176">DATA PAGES</text>
<text class="sub" x="64" y="309">Rows occupy data pages; their physical order does not have to match MemberID.</text>
<rect x="90" y="330" width="330" height="300" rx="10" fill="#fff" stroke="#7F9DBB" stroke-width="2"/>
    <path d="M100 330 H410 Q420 330 420 340 V375 H90 V340 Q90 330 100 330Z" fill="#EAF1F8"/>
    <text class="page" x="255.0" y="359" text-anchor="middle">DATA PAGE 1</text>
    <text class="head" x="112" y="405">MemberID</text><text class="head" x="220" y="405">FirstName</text><text class="head" x="320" y="405">LastName</text>
    <line x1="90" y1="417" x2="420" y2="417" stroke="#D8E1EC"/><text class="cell" x="112" y="455">27</text><text class="cell" x="220" y="455">Noah</text><text class="cell" x="320" y="455">Carter</text>
        <line x1="106" y1="470" x2="404" y2="470" stroke="#E2E8F0"/><text class="cell" x="112" y="508">11</text><text class="cell" x="220" y="508">Oliver</text><text class="cell" x="320" y="508">Brooks</text>
        <line x1="106" y1="523" x2="404" y2="523" stroke="#E2E8F0"/><text x="255.0" y="600" text-anchor="middle" font-size="13" fill="#94A3B8">available space</text><rect x="465" y="330" width="330" height="300" rx="10" fill="#fff" stroke="#7F9DBB" stroke-width="2"/>
    <path d="M475 330 H785 Q795 330 795 340 V375 H465 V340 Q465 330 475 330Z" fill="#EAF1F8"/>
    <text class="page" x="630.0" y="359" text-anchor="middle">DATA PAGE 2</text>
    <text class="head" x="487" y="405">MemberID</text><text class="head" x="595" y="405">FirstName</text><text class="head" x="695" y="405">LastName</text>
    <line x1="465" y1="417" x2="795" y2="417" stroke="#D8E1EC"/><text class="cell" x="487" y="455">43</text><text class="cell" x="595" y="455">Ava</text><text class="cell" x="695" y="455">Collins</text>
        <line x1="481" y1="470" x2="779" y2="470" stroke="#E2E8F0"/><text class="cell" x="487" y="508">19</text><text class="cell" x="595" y="508">Emma</text><text class="cell" x="695" y="508">Reed</text>
        <line x1="481" y1="523" x2="779" y2="523" stroke="#E2E8F0"/><text x="630.0" y="600" text-anchor="middle" font-size="13" fill="#94A3B8">available space</text><rect x="840" y="330" width="330" height="300" rx="10" fill="#fff" stroke="#7F9DBB" stroke-width="2"/>
    <path d="M850 330 H1160 Q1170 330 1170 340 V375 H840 V340 Q840 330 850 330Z" fill="#EAF1F8"/>
    <text class="page" x="1005.0" y="359" text-anchor="middle">DATA PAGE 3</text>
    <text class="head" x="862" y="405">MemberID</text><text class="head" x="970" y="405">FirstName</text><text class="head" x="1070" y="405">LastName</text>
    <line x1="840" y1="417" x2="1170" y2="417" stroke="#D8E1EC"/><text class="cell" x="862" y="455">56</text><text class="cell" x="970" y="455">Mia</text><text class="cell" x="1070" y="455">Parker</text>
        <line x1="856" y1="470" x2="1154" y2="470" stroke="#E2E8F0"/><text class="cell" x="862" y="508">79</text><text class="cell" x="970" y="508">Chloe</text><text class="cell" x="1070" y="508">Bush</text>
        <line x1="856" y1="523" x2="1154" y2="523" stroke="#E2E8F0"/><text x="1005.0" y="600" text-anchor="middle" font-size="13" fill="#94A3B8">available space</text><rect x="1215" y="330" width="295" height="300" rx="10" fill="#fff" stroke="#7F9DBB" stroke-width="2"/>
    <path d="M1225 330 H1500 Q1510 330 1510 340 V375 H1215 V340 Q1215 330 1225 330Z" fill="#EAF1F8"/>
    <text class="page" x="1362.5" y="359" text-anchor="middle">DATA PAGE 4</text>
    <text class="head" x="1237" y="405">MemberID</text><text class="head" x="1345" y="405">FirstName</text><text class="head" x="1445" y="405">LastName</text>
    <line x1="1215" y1="417" x2="1510" y2="417" stroke="#D8E1EC"/><text class="cell" x="1237" y="455">61</text><text class="cell" x="1345" y="455">Sofia</text><text class="cell" x="1445" y="455">Ford</text>
        <line x1="1231" y1="470" x2="1494" y2="470" stroke="#E2E8F0"/><text x="1362.5" y="600" text-anchor="middle" font-size="13" fill="#94A3B8">available space</text>
<text x="800" y="690" text-anchor="middle" font-size="15" font-weight="600" fill="#64748B">Pages belong to the same table — they do not form a search tree.</text>
<rect x="64" y="745" width="1472" height="112" rx="10" fill="#F8FAFC" stroke="#D8E1EC"/>
<circle cx="94" cy="787" r="6" fill="#EA8A19"/><text class="note" x="114" y="793">MemberID values are deliberately shown out of order.</text>
<circle cx="94" cy="825" r="6" fill="#0F766E"/><text class="note" x="114" y="831">A heap has no clustered index that maintains row order by a key. To find a row without a suitable nonclustered index, SQL Server may scan the heap.</text>
</svg>