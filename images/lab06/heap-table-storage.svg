<text x="92" y="191" font-size="28" font-weight="700">dbo.Member</text>
<text x="410" y="158" font-size="15" font-weight="700" fill="#64748B">STORAGE ORGANIZATION</text>
<text x="410" y="191" font-size="23" font-weight="600">Heap — data pages without a clustered index</text>
