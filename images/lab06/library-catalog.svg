<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="740" viewBox="0 160 1440 740" role="img" aria-labelledby="ttl desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="ttl">Library catalog: finding books with an index</title>
<desc id="desc">Three cabinets divided into alphabetical drawers. The A-B drawer points to four alphabetical author cards with shelf references. Actual books are on shelves not ordered by author.</desc>
<defs>
 <style>
 .title{font:700 37px Arial,sans-serif;fill:#203a60}.subtitle{font:21px Arial,sans-serif;fill:#52647a}
 .head{font:700 26px Arial,sans-serif;fill:#26476f}.cab{font:700 29px Arial,sans-serif;fill:#24466f}
 .drawer{font:24px Arial,sans-serif;fill:#263950}.author{font:700 22px Arial,sans-serif;fill:#1f3045}
 .book{font:20px Arial,sans-serif;fill:#37475b}.shelf{font:700 21px Arial,sans-serif;fill:#a85919}
 .foot{font:23px Arial,sans-serif;fill:#456453}.line{stroke:#8ba0b5;stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
 </style>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#688fbd"/></marker>
</defs>
<rect width="1440" height="900" fill="#fff"/>
<text class="head" x="83" y="202">Cabinets</text>
<text class="head" x="320" y="202">Drawers</text>
<text class="head" x="772" y="202">Index cards</text>
<!-- Cabinets and drawer connectors -->
<g class="line">
 <path d="M208 302 L295 263 M208 302 L295 318 M208 302 L295 373"/>
 <path d="M208 502 L295 463 M208 502 L295 518 M208 502 L295 573"/>
 <path d="M208 702 L295 663 M208 702 L295 718 M208 702 L295 773"/>
</g>
<g fill="#edf3fa" stroke="#4472aa" stroke-width="3">
 <rect x="83" y="249" width="125" height="106" rx="5"/>
 <rect x="83" y="449" width="125" height="106" rx="5"/>
 <rect x="83" y="649" width="125" height="106" rx="5"/>
</g>
<g class="cab" text-anchor="middle"><text x="145" y="311">A–F</text><text x="145" y="511">G–N</text><text x="145" y="711">O–Z</text></g>
<g fill="#fff" stroke="#7395c0" stroke-width="2.6">
 <rect x="295" y="238" width="195" height="49" rx="3"/><rect x="295" y="293" width="195" height="49" rx="3"/><rect x="295" y="348" width="195" height="49" rx="3"/>
 <rect x="295" y="438" width="195" height="49" rx="3"/><rect x="295" y="493" width="195" height="49" rx="3"/><rect x="295" y="548" width="195" height="49" rx="3"/>
 <rect x="295" y="638" width="195" height="49" rx="3"/><rect x="295" y="693" width="195" height="49" rx="3"/><rect x="295" y="748" width="195" height="49" rx="3"/>
</g>
<g class="drawer" text-anchor="middle">
 <text x="393" y="270">A–B</text><text x="393" y="325">C–D</text><text x="393" y="380">E–F</text>
 <text x="393" y="470">G–I</text><text x="393" y="525">J–L</text><text x="393" y="580">M–N</text>
 <text x="393" y="670">O–R</text><text x="393" y="725">S–U</text><text x="393" y="780">V–Z</text>
</g>
<!-- Links from the A-B drawer to alphabetical index cards -->
<g stroke="#90a2b4" stroke-width="2" fill="none"><path d="M490 263 L707 258 M490 263 L707 365 M490 263 L707 472 M490 263 L707 579"/></g>
<!-- cards -->
<g fill="#f9fbfe" stroke="#6288ba" stroke-width="2.5">
 <rect x="707" y="223" width="672" height="88" rx="4"/>
 <rect x="707" y="330" width="672" height="88" rx="4"/>
 <rect x="707" y="437" width="672" height="88" rx="4"/>
 <rect x="707" y="544" width="672" height="88" rx="4"/>
</g>
<g class="author"><text x="730" y="254">Adams, Douglas</text><text x="730" y="361">Asimov, Isaac</text><text x="730" y="468">Baum, L. Frank</text><text x="730" y="575">Brown, Dan</text></g>
<g class="book"><text x="730" y="286">The Hitchhiker's Guide to the Galaxy</text><text x="730" y="393">I, Robot</text><text x="730" y="500">The Wonderful Wizard of Oz</text><text x="730" y="607">The Da Vinci Code</text></g>
<g class="shelf" text-anchor="end"><text x="1355" y="283">Shelf 10</text><text x="1355" y="390">Shelf 24</text><text x="1355" y="497">Shelf 75</text><text x="1355" y="604">Shelf 48</text></g>
<!-- Shelves note -->
<path d="M1050 639 V688" stroke="#688fbd" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="758" y="710" width="583" height="132" rx="20" fill="#e3f1e7" stroke="#83af93" stroke-width="2.5"/>
<text x="1049" y="754" style="font:700 30px Arial,sans-serif" text-anchor="middle" fill="#2e6744">Bookshelves</text>
<text x="1049" y="791" class="foot" text-anchor="middle">Actual books are stored here</text>
<text x="1049" y="823" class="foot" text-anchor="middle">Books do not need to be sorted by author</text>
</svg>
