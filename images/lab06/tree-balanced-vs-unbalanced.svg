<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Leaf depths: unbalanced vs. B+ tree</title>
<desc id="desc">Conceptual comparison: the left tree has leaves at different depths, while the right tree illustrates the equal leaf depth required by a B+ tree.</desc>

<defs>
 <style>
  text{font-family:Arial,Helvetica,sans-serif;fill:#1E293B}
  .title{font-size:32px;font-weight:700}
  .subtitle{font-size:17px;fill:#64748B}
  .label{font-size:19px;font-weight:600}
  .nodeText{font-size:25px;font-weight:700;text-anchor:middle;dominant-baseline:middle;fill:#102033}
  .edge{stroke:#91A8C3;stroke-width:2.3;fill:none;stroke-linecap:round}
  .note{font-size:16px;fill:#334155}
  .level{font-size:17px;fill:#334155}
 </style>
</defs>

<rect width="1600" height="900" fill="#FFFFFF"/>
<text class="title" x="64" y="64">Leaf depths: unbalanced vs. B+ tree</text>
<text class="subtitle" x="64" y="96">In a B+ tree, all leaf nodes are at the same depth.</text>

<!-- panel headings -->
<text x="420" y="174" text-anchor="middle" font-size="24" font-weight="700">Unequal leaf depths</text>
<text x="1180" y="174" text-anchor="middle" font-size="24" font-weight="700">B+ tree property</text>

<!-- Left tree edges -->
<g class="edge">
 <path d="M420 278 C360 310 300 330 260 375"/>
 <path d="M420 278 C485 310 535 330 580 375"/>
 <path d="M260 435 C235 470 205 500 190 535"/>
 <path d="M580 435 C545 470 505 500 470 535"/>
 <path d="M580 435 C585 475 600 505 615 535"/>
 <path d="M580 435 C640 470 690 500 730 535"/>
 <path d="M470 595 C445 630 415 660 390 695"/>
 <path d="M470 595 C500 630 525 660 550 695"/>
</g>
<!-- Left nodes -->
<g>
 <circle cx="420" cy="250" r="37" fill="#5B9BD5" stroke="#3F83BD" stroke-width="1.5"/><text class="nodeText" x="420" y="250">A</text>
 <circle cx="260" cy="405" r="37" fill="#5B9BD5" stroke="#3F83BD" stroke-width="1.5"/><text class="nodeText" x="260" y="405">B</text>
 <circle cx="580" cy="405" r="37" fill="#5B9BD5" stroke="#3F83BD" stroke-width="1.5"/><text class="nodeText" x="580" y="405">J</text>
 <circle cx="190" cy="565" r="37" fill="#5B9BD5" stroke="#3F83BD" stroke-width="1.5"/><text class="nodeText" x="190" y="565">E</text>
 <circle cx="470" cy="565" r="37" fill="#5B9BD5" stroke="#3F83BD" stroke-width="1.5"/><text class="nodeText" x="470" y="565">C</text>
 <circle cx="615" cy="565" r="37" fill="#5B9BD5" stroke="#3F83BD" stroke-width="1.5"/><text class="nodeText" x="615" y="565">H</text>
 <circle cx="730" cy="565" r="37" fill="#5B9BD5" stroke="#3F83BD" stroke-width="1.5"/><text class="nodeText" x="730" y="565">G</text>
 <circle cx="390" cy="725" r="37" fill="#5B9BD5" stroke="#3F83BD" stroke-width="1.5"/><text class="nodeText" x="390" y="725">F</text>
 <circle cx="550" cy="725" r="37" fill="#5B9BD5" stroke="#3F83BD" stroke-width="1.5"/><text class="nodeText" x="550" y="725">D</text>
</g>

<!-- Right tree edges -->
<g class="edge">
 <path d="M1180 278 C1115 310 1060 335 1010 375"/>
 <path d="M1180 278 C1245 310 1300 335 1350 375"/>
 <path d="M1010 435 C985 470 960 500 940 535"/>
 <path d="M1350 435 C1315 470 1280 500 1250 535"/>
 <path d="M1350 435 C1350 475 1350 505 1350 535"/>
 <path d="M1350 435 C1395 470 1435 500 1470 535"/>
</g>
<!-- Right nodes -->
<g>
 <circle cx="1180" cy="250" r="37" fill="#FFC84A" stroke="#D99A10" stroke-width="1.5"/><text class="nodeText" x="1180" y="250">A</text>
 <circle cx="1010" cy="405" r="37" fill="#F3B27E" stroke="#C88749" stroke-width="1.5"/><text class="nodeText" x="1010" y="405">B</text>
 <circle cx="1350" cy="405" r="37" fill="#F3B27E" stroke="#C88749" stroke-width="1.5"/><text class="nodeText" x="1350" y="405">J</text>
 <circle cx="940" cy="565" r="37" fill="#A7DCC3" stroke="#5B9F80" stroke-width="1.5"/><text class="nodeText" x="940" y="565">E</text>
 <circle cx="1250" cy="565" r="37" fill="#A7DCC3" stroke="#5B9F80" stroke-width="1.5"/><text class="nodeText" x="1250" y="565">C</text>
 <circle cx="1350" cy="565" r="37" fill="#A7DCC3" stroke="#5B9F80" stroke-width="1.5"/><text class="nodeText" x="1350" y="565">H</text>
 <circle cx="1470" cy="565" r="37" fill="#A7DCC3" stroke="#5B9F80" stroke-width="1.5"/><text class="nodeText" x="1470" y="565">G</text>
</g>

<!-- Bottom explanation -->
<text x="1180" y="675" text-anchor="middle" font-size="17" fill="#3E7060">All leaves at level 2</text>
<rect x="64" y="800" width="1472" height="58" rx="10" fill="#F8FAFC" stroke="#D8E1EC"/>
<circle cx="92" cy="829" r="7" fill="#EA8A19"/>
<text class="note" x="112" y="835">Left: leaf depths vary.</text>
<circle cx="600" cy="829" r="7" fill="#0F766E"/>
<text class="note" x="620" y="835">Right: all leaves are at depth 2.</text>
</svg>