<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Tree terminology: root, internal nodes, leaves, levels and depth</title>
<desc id="desc">A balanced tree with four levels from zero to three. All leaves are at level three and the maximum depth is three edges.</desc>
