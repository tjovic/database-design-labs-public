<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Where do transaction changes live?</title><desc id="desc">Two memory areas, two kinds of files - connected by write-ahead logging.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#52647a"/></marker></defs><rect width="1200" height="650" fill="#f4f7fc"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="40" y="48" font-size="30" fill="#172b4d" font-weight="bold" text-anchor="start">Where do transaction changes live?</text><text x="40" y="82" font-size="18" fill="#52647a" font-weight="normal" text-anchor="start">Two memory areas, two kinds of files - connected by write-ahead logging.</text><text x="45" y="130" font-size="21" fill="#172b4d" font-weight="bold" text-anchor="start">RAM - changes can be lost after a crash</text><rect x="45" y="150" width="520" height="150" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="67" y="184" font-size="22" fill="#2563eb" font-weight="bold" text-anchor="start">Buffer pool</text><text x="67" y="218" font-size="19" fill="#172b4d" font-weight="normal" text-anchor="start">Modified data pages (dirty pages)</text><text x="67" y="247" font-size="19" fill="#172b4d" font-weight="normal" text-anchor="start">Account A: 800.00 | Account B: 700.00</text><rect x="635" y="150" width="520" height="150" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="657" y="184" font-size="22" fill="#2563eb" font-weight="bold" text-anchor="start">Log buffer</text><text x="657" y="218" font-size="19" fill="#172b4d" font-weight="normal" text-anchor="start">Log records generated by the changes</text><text x="657" y="247" font-size="19" fill="#172b4d" font-weight="normal" text-anchor="start">Including the commit record when committing</text><path d="M550,300 L550,420" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arr)"/><path d="M1130,300 L1130,420" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arr)"/><text x="55" y="355" font-size="18" fill="#52647a" font-weight="normal" text-anchor="start">Data pages can be written later</text><text x="655" y="355" font-size="18" fill="#52647a" font-weight="normal" text-anchor="start">Flush log records to durable storage</text><rect x="45" y="420" width="520" height="130" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="67" y="454" font-size="22" fill="#2563eb" font-weight="bold" text-anchor="start">Data files (.mdf / .ndf)</text><text x="67" y="488" font-size="19" fill="#172b4d" font-weight="normal" text-anchor="start">Store table and index pages</text><rect x="635" y="420" width="520" height="130" rx="14" fill="white" stroke="#15803d" stroke-width="2"/><text x="657" y="454" font-size="22" fill="#15803d" font-weight="bold" text-anchor="start">Transaction log file (.ldf)</text><text x="657" y="488" font-size="19" fill="#172b4d" font-weight="normal" text-anchor="start">Durable recovery information</text><text x="40" y="595" font-size="21" fill="#172b4d" font-weight="bold" text-anchor="start">WAL: the relevant log records must be durable before a modified page is written.</text><text x="40" y="626" font-size="18" fill="#52647a" font-weight="normal" text-anchor="start">Fully durable COMMIT: required log records are durable before success is acknowledged.</text></g></svg>