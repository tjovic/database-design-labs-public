<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">A simplified transaction log</title><desc id="desc">Use the same two account updates as in the SQL examples.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#52647a"/></marker></defs><rect width="1200" height="650" fill="#f4f7fc"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="40" y="48" font-size="30" fill="#172b4d" font-weight="bold" text-anchor="start">A simplified transaction log</text><text x="40" y="82" font-size="18" fill="#52647a" font-weight="normal" text-anchor="start">Use the same two account updates as in the SQL examples.</text><rect x="40" y="120" width="1120" height="100" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="62" y="154" font-size="22" fill="#2563eb" font-weight="bold" text-anchor="start">One transfer: 200.00 from A to B</text><text x="62" y="188" font-size="19" fill="#172b4d" font-weight="normal" text-anchor="start">Initial balances: A = 1000.00, B = 500.00 | Intended result: A = 800.00, B = 700.00</text><rect x="40" y="250" width="1120" height="48" rx="7" fill="#e0eaff"/><text x="65" y="278" font-size="21" fill="#172b4d" font-weight="normal" text-anchor="start">1</text><text x="180" y="278" font-size="21" fill="#172b4d" font-weight="normal" text-anchor="start">T1</text><text x="330" y="278" font-size="21" fill="#172b4d" font-weight="normal" text-anchor="start">BEGIN</text><text x="590" y="278" font-size="21" fill="#172b4d" font-weight="normal" text-anchor="start">Start the transaction</text><rect x="40" y="307" width="1120" height="48" rx="7" fill="#e0eaff"/><text x="65" y="335" font-size="21" fill="#172b4d" font-weight="normal" text-anchor="start">2</text><text x="180" y="335" font-size="21" fill="#172b4d" font-weight="normal" text-anchor="start">T1</text><text x="330" y="335" font-size="21" fill="#172b4d" font-weight="normal" text-anchor="start">Change A</text><text x="590" y="335" font-size="21" fill="#172b4d" font-weight="normal" text-anchor="start">1000.00 -&gt; 800.00</text><rect x="40" y="364" width="1120" height="48" rx="7" fill="#e0eaff"/><text x="65" y="392" font-size="21" fill="#172b4d" font-weight="normal" text-anchor="start">3</text><text x="180" y="392" font-size="21" fill="#172b4d" font-weight="normal" text-anchor="start">T1</text><text x="330" y="392" font-size="21" fill="#172b4d" font-weight="normal" text-anchor="start">Change B</text><text x="590" y="392" font-size="21" fill="#172b4d" font-weight="normal" text-anchor="start">500.00 -&gt; 700.00</text><rect x="40" y="421" width="1120" height="48" rx="7" fill="#dcfce7"/><text x="65" y="449" font-size="21" fill="#172b4d" font-weight="normal" text-anchor="start">4</text><text x="180" y="449" font-size="21" fill="#172b4d" font-weight="normal" text-anchor="start">T1</text><text x="330" y="449" font-size="21" fill="#172b4d" font-weight="normal" text-anchor="start">COMMIT</text><text x="590" y="449" font-size="21" fill="#172b4d" font-weight="normal" text-anchor="start">Confirm the transaction</text><text x="40" y="523" font-size="22" fill="#172b4d" font-weight="bold" text-anchor="start">Log records follow an order. Each change belongs to a transaction.</text><text x="40" y="564" font-size="19" fill="#52647a" font-weight="normal" text-anchor="start">The old/new values are a teaching model of recovery information.</text><text x="40" y="596" font-size="19" fill="#52647a" font-weight="normal" text-anchor="start">This is not the physical format of SQL Server log records.</text></g></svg>