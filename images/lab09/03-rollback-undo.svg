<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">ROLLBACK uses recovery information to undo changes</title><desc id="desc">Conceptual example: changes are undone in reverse order within this transaction.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#52647a"/></marker></defs><rect width="1200" height="650" fill="#f4f7fc"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="40" y="48" font-size="30" fill="#172b4d" font-weight="bold" text-anchor="start">ROLLBACK uses recovery information to undo changes</text><text x="40" y="82" font-size="18" fill="#52647a" font-weight="normal" text-anchor="start">Conceptual example: changes are undone in reverse order within this transaction.</text><rect x="40" y="120" width="350" height="160" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="62" y="154" font-size="22" fill="#2563eb" font-weight="bold" text-anchor="start">Before the transfer</text><text x="62" y="188" font-size="19" fill="#172b4d" font-weight="normal" text-anchor="start">A = 1000.00</text><text x="62" y="217" font-size="19" fill="#172b4d" font-weight="normal" text-anchor="start">B = 500.00</text><rect x="425" y="120" width="350" height="160" rx="14" fill="white" stroke="#c2410c" stroke-width="2"/><text x="447" y="154" font-size="22" fill="#c2410c" font-weight="bold" text-anchor="start">After both updates</text><text x="447" y="188" font-size="19" fill="#172b4d" font-weight="normal" text-anchor="start">A = 800.00</text><text x="447" y="217" font-size="19" fill="#172b4d" font-weight="normal" text-anchor="start">B = 700.00</text><rect x="810" y="120" width="350" height="160" rx="14" fill="white" stroke="#15803d" stroke-width="2"/><text x="832" y="154" font-size="22" fill="#15803d" font-weight="bold" text-anchor="start">After full rollback</text><text x="832" y="188" font-size="19" fill="#172b4d" font-weight="normal" text-anchor="start">A = 1000.00</text><text x="832" y="217" font-size="19" fill="#172b4d" font-weight="normal" text-anchor="start">B = 500.00</text><path d="M390,205 L425,205" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arr)"/><path d="M775,205 L810,205" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arr)"/><rect x="40" y="325" width="1120" height="105" rx="14" fill="white" stroke="#c2410c" stroke-width="2"/><text x="62" y="359" font-size="22" fill="#c2410c" font-weight="bold" text-anchor="start">UNDO step 1 - undo the later change</text><text x="62" y="393" font-size="19" fill="#172b4d" font-weight="normal" text-anchor="start">Account B: restore 500.00 instead of 700.00</text><path d="M600,430 L600,465" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arr)"/><rect x="40" y="470" width="1120" height="105" rx="14" fill="white" stroke="#15803d" stroke-width="2"/><text x="62" y="504" font-size="22" fill="#15803d" font-weight="bold" text-anchor="start">UNDO step 2 - undo the earlier change</text><text x="62" y="538" font-size="19" fill="#172b4d" font-weight="normal" text-anchor="start">Account A: restore 1000.00 instead of 800.00</text><text x="40" y="620" font-size="22" fill="#172b4d" font-weight="bold" text-anchor="start">Outcome: neither update remains. This illustrates atomicity.</text></g></svg>