<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Why a confirmed transfer survives a crash</title><desc id="desc">The transaction log makes durability possible even when data files have not caught up.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#52647a"/></marker></defs><rect width="1200" height="650" fill="#f4f7fc"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="40" y="48" font-size="30" fill="#172b4d" font-weight="bold" text-anchor="start">Why a confirmed transfer survives a crash</text><text x="40" y="82" font-size="18" fill="#52647a" font-weight="normal" text-anchor="start">The transaction log makes durability possible even when data files have not caught up.</text><rect x="40" y="120" width="540" height="175" rx="14" fill="white" stroke="#15803d" stroke-width="2"/><text x="62" y="154" font-size="22" fill="#15803d" font-weight="bold" text-anchor="start">1. Fully durable COMMIT</text><text x="62" y="188" font-size="19" fill="#172b4d" font-weight="normal" text-anchor="start">Required log records reach stable storage.</text><text x="62" y="217" font-size="19" fill="#172b4d" font-weight="normal" text-anchor="start">COMMIT succeeds.</text><text x="62" y="246" font-size="19" fill="#172b4d" font-weight="normal" text-anchor="start">The transfer is confirmed.</text><rect x="620" y="120" width="540" height="175" rx="14" fill="white" stroke="#b91c1c" stroke-width="2"/><text x="642" y="154" font-size="22" fill="#b91c1c" font-weight="bold" text-anchor="start">2. Crash before data pages are flushed</text><text x="642" y="188" font-size="19" fill="#172b4d" font-weight="normal" text-anchor="start">RAM is lost.</text><text x="642" y="217" font-size="19" fill="#172b4d" font-weight="normal" text-anchor="start">Data files may still hold older page versions.</text><text x="642" y="246" font-size="19" fill="#172b4d" font-weight="normal" text-anchor="start">The durable log survives.</text><path d="M580,210 L620,210" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arr)"/><rect x="40" y="350" width="540" height="160" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="62" y="384" font-size="22" fill="#2563eb" font-weight="bold" text-anchor="start">3. Recovery uses the log</text><text x="62" y="418" font-size="19" fill="#172b4d" font-weight="normal" text-anchor="start">REDO restores any missing logged changes.</text><text x="62" y="447" font-size="19" fill="#172b4d" font-weight="normal" text-anchor="start">It does not call the procedure again.</text><rect x="620" y="350" width="540" height="160" rx="14" fill="white" stroke="#15803d" stroke-width="2"/><text x="642" y="384" font-size="22" fill="#15803d" font-weight="bold" text-anchor="start">4. Confirmed result survives</text><text x="642" y="418" font-size="19" fill="#172b4d" font-weight="normal" text-anchor="start">Account A = 800.00</text><text x="642" y="447" font-size="19" fill="#172b4d" font-weight="normal" text-anchor="start">Account B = 700.00</text><path d="M890,295 L890,325" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arr)"/><path d="M890,325 L310,325" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arr)"/><path d="M310,325 L310,350" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arr)"/><path d="M580,430 L620,430" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arr)"/><text x="40" y="568" font-size="21" fill="#172b4d" font-weight="bold" text-anchor="start">COMMIT does not require every changed data page to be flushed immediately.</text><text x="40" y="611" font-size="18" fill="#52647a" font-weight="normal" text-anchor="start">Assumption: normal fully durable commit; log files and storage remain available.</text></g></svg>