<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Several transactions share the transaction log</title><desc id="desc">Different colors identify records belonging to different transactions.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#52647a"/></marker></defs><rect width="1200" height="650" fill="#f4f7fc"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="40" y="48" font-size="30" fill="#172b4d" font-weight="bold" text-anchor="start">Several transactions share the transaction log</text><text x="40" y="82" font-size="18" fill="#52647a" font-weight="normal" text-anchor="start">Different colors identify records belonging to different transactions.</text><text x="40" y="135" font-size="24" fill="#172b4d" font-weight="bold" text-anchor="start">One shared log stream</text><rect x="40" y="170" width="150" height="120" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="62" y="204" font-size="22" fill="#2563eb" font-weight="bold" text-anchor="start">T1</text><text x="62" y="238" font-size="19" fill="#172b4d" font-weight="normal" text-anchor="start">BEGIN</text><path d="M190,230 L201,230" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arr)"/><rect x="201" y="170" width="150" height="120" rx="14" fill="white" stroke="#15803d" stroke-width="2"/><text x="223" y="204" font-size="22" fill="#15803d" font-weight="bold" text-anchor="start">T2</text><text x="223" y="238" font-size="19" fill="#172b4d" font-weight="normal" text-anchor="start">BEGIN</text><path d="M351,230 L362,230" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arr)"/><rect x="362" y="170" width="150" height="120" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="384" y="204" font-size="22" fill="#2563eb" font-weight="bold" text-anchor="start">T1</text><text x="384" y="238" font-size="19" fill="#172b4d" font-weight="normal" text-anchor="start">A update</text><path d="M512,230 L523,230" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arr)"/><rect x="523" y="170" width="150" height="120" rx="14" fill="white" stroke="#15803d" stroke-width="2"/><text x="545" y="204" font-size="22" fill="#15803d" font-weight="bold" text-anchor="start">T2</text><text x="545" y="238" font-size="19" fill="#172b4d" font-weight="normal" text-anchor="start">X update</text><path d="M673,230 L684,230" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arr)"/><rect x="684" y="170" width="150" height="120" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="706" y="204" font-size="22" fill="#2563eb" font-weight="bold" text-anchor="start">T1</text><text x="706" y="238" font-size="19" fill="#172b4d" font-weight="normal" text-anchor="start">B update</text><path d="M834,230 L845,230" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arr)"/><rect x="845" y="170" width="150" height="120" rx="14" fill="white" stroke="#15803d" stroke-width="2"/><text x="867" y="204" font-size="22" fill="#15803d" font-weight="bold" text-anchor="start">T2</text><text x="867" y="238" font-size="19" fill="#172b4d" font-weight="normal" text-anchor="start">COMMIT</text><path d="M995,230 L1006,230" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arr)"/><rect x="1006" y="170" width="150" height="120" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="1028" y="204" font-size="22" fill="#2563eb" font-weight="bold" text-anchor="start">T1</text><text x="1028" y="238" font-size="19" fill="#172b4d" font-weight="normal" text-anchor="start">COMMIT</text><rect x="40" y="350" width="540" height="155" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="62" y="384" font-size="22" fill="#2563eb" font-weight="bold" text-anchor="start">T1: transfer between accounts</text><text x="62" y="418" font-size="19" fill="#172b4d" font-weight="normal" text-anchor="start">Its records are interleaved with T2 records.</text><text x="62" y="447" font-size="19" fill="#172b4d" font-weight="normal" text-anchor="start">Recovery can identify the records for T1.</text><rect x="620" y="350" width="540" height="155" rx="14" fill="white" stroke="#15803d" stroke-width="2"/><text x="642" y="384" font-size="22" fill="#15803d" font-weight="bold" text-anchor="start">T2: another operation</text><text x="642" y="418" font-size="19" fill="#172b4d" font-weight="normal" text-anchor="start">It has its own transaction identity.</text><text x="642" y="447" font-size="19" fill="#172b4d" font-weight="normal" text-anchor="start">It can finish before T1.</text><text x="40" y="565" font-size="23" fill="#172b4d" font-weight="bold" text-anchor="start">The log is shared; each transaction can still be followed separately.</text><text x="40" y="610" font-size="18" fill="#52647a" font-weight="normal" text-anchor="start">This illustrates logging. Locking and concurrent data access are covered in Lab 10.</text></g></svg>