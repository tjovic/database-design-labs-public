<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Which outcomes must recovery preserve?</title><desc id="desc">A commit marker means a successful fully durable commit before the crash.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#52647a"/></marker></defs><rect width="1200" height="680" fill="#f4f7fc"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="40" y="48" font-size="30" fill="#172b4d" font-weight="bold" text-anchor="start">Which outcomes must recovery preserve?</text><text x="40" y="82" font-size="18" fill="#52647a" font-weight="normal" text-anchor="start">A commit marker means a successful fully durable commit before the crash.</text><line x1="400" y1="155" x2="400" y2="505" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 6"/><line x1="980" y1="155" x2="980" y2="505" stroke="#b91c1c" stroke-width="7"/><text x="400" y="135" font-size="20" fill="#2563eb" font-weight="bold" text-anchor="middle">Checkpoint</text><text x="980" y="135" font-size="20" fill="#b91c1c" font-weight="bold" text-anchor="middle">Crash</text><text x="55" y="217" font-size="23" fill="#15803d" font-weight="bold" text-anchor="start">T1</text><line x1="200" y1="210" x2="330" y2="210" stroke="#15803d" stroke-width="6"/><circle cx="200" cy="210" r="6" fill="#15803d"/><circle cx="330" cy="210" r="9" fill="#15803d"/><text x="346" y="216" font-size="16" fill="#15803d" font-weight="normal" text-anchor="start">COMMIT</text><text x="55" y="282" font-size="23" fill="#15803d" font-weight="bold" text-anchor="start">T2</text><line x1="275" y1="275" x2="620" y2="275" stroke="#15803d" stroke-width="6"/><circle cx="275" cy="275" r="6" fill="#15803d"/><circle cx="620" cy="275" r="9" fill="#15803d"/><text x="636" y="281" font-size="16" fill="#15803d" font-weight="normal" text-anchor="start">COMMIT</text><text x="55" y="347" font-size="23" fill="#c2410c" font-weight="bold" text-anchor="start">T3</text><line x1="330" y1="340" x2="980" y2="340" stroke="#c2410c" stroke-width="6"/><circle cx="330" cy="340" r="6" fill="#c2410c"/><text x="1005" y="346" font-size="18" fill="#c2410c" font-weight="normal" text-anchor="start">Active</text><text x="55" y="412" font-size="23" fill="#15803d" font-weight="bold" text-anchor="start">T4</text><line x1="505" y1="405" x2="840" y2="405" stroke="#15803d" stroke-width="6"/><circle cx="505" cy="405" r="6" fill="#15803d"/><circle cx="840" cy="405" r="9" fill="#15803d"/><text x="856" y="411" font-size="16" fill="#15803d" font-weight="normal" text-anchor="start">COMMIT</text><text x="55" y="477" font-size="23" fill="#c2410c" font-weight="bold" text-anchor="start">T5</text><line x1="590" y1="470" x2="980" y2="470" stroke="#c2410c" stroke-width="6"/><circle cx="590" cy="470" r="6" fill="#c2410c"/><text x="1005" y="476" font-size="18" fill="#c2410c" font-weight="normal" text-anchor="start">Active</text><path d="M150,530 L1140,530" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arr)"/><text x="1080" y="560" font-size="18" fill="#52647a" font-weight="normal" text-anchor="start">Time</text><text x="40" y="600" font-size="22" fill="#172b4d" font-weight="bold" text-anchor="start">Committed: preserve T1, T2, T4. Incomplete: undo T3, T5.</text><text x="40" y="636" font-size="18" fill="#52647a" font-weight="normal" text-anchor="start">The timeline alone does not identify which individual page changes need REDO.</text></g></svg>